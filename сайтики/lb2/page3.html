<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея изображений</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .gallery-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 2rem;
        }

        .main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
        }

        .thumbnails {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .thumbnail-link {
            display: block;
            width: 120px;
            height: 120px;
            overflow: hidden;
            border-radius: 8px;
            border: 3px;
        }

        .thumbnail-link:hover {
            border-color: #4CAF50;
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.4);
        }

        .thumbnail-link img {
            width: 100%;
            height: 100%;
        }

        .thumbnail-link:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1>Галерея изображений</h1>
        <img src="Cat-3.jpg" class="main-image">
        
        <div class="thumbnails">
            <a href="page1.html" class="thumbnail-link">
                <img src="Cat-1.jpg">
            </a>
            <a href="page2.html" class="thumbnail-link">
                <img src="Cat-2.jpg">
            </a>
            <a href="page3.html" class="thumbnail-link">
                <img src="Cat-3.jpg">
            </a>
            <a href="page4.html" class="thumbnail-link">
                <img src="Cat-4.jpg">
            </a>
        </div>
    </div>
</body>
</html>
