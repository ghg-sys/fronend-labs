<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Имитация загрузки видео</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .upload-card {
            max-width: 1280px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .upload-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.75rem;
            padding: 2rem 2rem 2rem 2rem;
        }

        .image-block {
            flex: 1.2;
            min-width: 200px;
            background: #f0f4f9;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 8px 20px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .image-wrapper {
            width: 100%;
            text-align: center;
        }

        .video-preview {
            width: 100%;
            max-width: 280px;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            background: #d9e2ec;
        }

        .info-block {
            flex: 2;
            min-width: 240px;
            background: #ffffff;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
            padding: 0.25rem 0;
        }

        .upload-percent {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e2a3a, #0f1724);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .percent-large {
            font-size: 3rem;
            margin-right: 0.2rem;
        }

        .time-remaining {
            font-size: 0.95rem;
            color: #4b5563;
            background: #f1f5f9;
            display: inline-block;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            width: fit-content;
            font-weight: 500;
        }

        .video-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #0a1c2f;
            margin-top: 0.5rem;
            word-break: break-word;
        }

        .progress-container {
            background-color: #e2e8f0;
            border-radius: 60px;
            height: 8px;
            width: 100%;
            margin: 0.5rem 0 0.25rem;
        }

        .progress-fill {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            width: 40%;
            border-radius: 60px;
            height: 100%;
            transition: width 0.25s ease-out;
        }

        .button-block {
            flex: 0.8;
            min-width: 140px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .action-btn {
            background: #eef2ff;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            color: #1e40af;
            cursor: default;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 160px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            opacity: 0.9;
        }

        @media (max-width: 880px) {
            .upload-grid {
                flex-direction: row;
                flex-wrap: wrap;
            }
            .image-block {
                flex: 1 1 200px;
            }
            .info-block {
                flex: 2 1 280px;
            }
            .button-block {
                flex: 1 1 100%;
                justify-content: flex-start;
                margin-top: 0.5rem;
            }
            .action-btn {
                max-width: 180px;
            }
        }

        @media (max-width: 680px) {
            .upload-grid {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem;
            }
            .image-block, .info-block, .button-block {
                width: 100%;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .button-block {
                justify-content: center;
            }
            .info-block {
                align-items: center;
                text-align: center;
            }
            .time-remaining {
                margin-left: auto;
                margin-right: auto;
            }
            .status-message {
                text-align: left;
            }
            .progress-container {
                max-width: 90%;
                margin-left: auto;
                margin-right: auto;
            }
            .video-title {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .upload-card {
                border-radius: 1.25rem;
            }
            .upload-grid {
                padding: 1.25rem;
            }
            .video-title {
                font-size: 1.35rem;
            }
            .upload-percent {
                font-size: 2rem;
            }
            .percent-large {
                font-size: 2.5rem;
            }
            .action-btn {
                padding: 0.7rem 1.4rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="upload-card">
    <div class="upload-grid">
        <div class="image-block">
            <div class="image-wrapper">
                <img class="video-preview" src="load.jpg"alt="">
            </div>
        </div>

        <div class="info-block">
            <div>
                <span class="upload-percent">
                    <span class="percent-large">40</span>%
                </span>
                <span class="time-remaining">About 23 minutes remaining</span>
            </div>
            <div class="progress-container">
                <div class="progress-fill" style="width: 40%;"></div>
            </div>
            <div class="video-title">Title of video</div>
            <div class="status-message">
                <span>Your video is still uploading. Please keep this page open until it’s done.</span>
            </div>
        </div>

        <div class="button-block">
            <button class="action-btn">
                DONE
            </button>
        </div>
    </div>
</div>
</body>
</html>
